services:
  prox-agent:
    build: .
    image: prox-agent:local
    container_name: prox-agent
    restart: unless-stopped
    env_file: [.env]
    environment:
      HOMELAB_API_URL: http://homelab-backend:8080
    networks: [homepage-net]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  homepage-net:
    external: true
